[workspace]
resolver = "2"
members = ["crates/*", "plugins/inputs/*", "plugins/outputs/*"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
log-proto = { path = "crates/log-proto" }
log-plugin-sdk = { path = "crates/log-plugin-sdk" }
