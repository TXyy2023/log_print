[workspace]
resolver = "2"
members = [
  "crates/log-proto",
  "crates/log-core",
  "crates/log-plugin-sdk",
  "crates/inputs/input-serial",
  "crates/inputs/input-log",
  "crates/inputs/input-mock",
  "crates/outputs/output-console",
  "crates/outputs/output-tui",
  "crates/outputs/output-api",
  "crates/outputs/output-mcp",
  "crates/app-log-print",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
warnings = "deny"
