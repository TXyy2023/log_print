[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "log-print-sdk"
version = "0.1.0"
description = "Python-native async input and output for log-print/2"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "log_print contributors"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
log_print_sdk = ["py.typed"]
